name: Catalog
on:
  push:
    paths:
      - "**/*.png"
      - "**/*.PNG"
      - "**/*.webp"
      - "**/*.gif"
      - "scripts/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_catalog.py
      - run: |
          git config user.name "eieiFX"
          git config user.email "bot@eiei.love"
          git add catalog.json
          if git diff --staged --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "อัปเดตรายการคลัง"
            git push
          fi
